<!doctype html><html><head><meta charset="utf-8"><title>CLI Reference</title><style>
:root{--brand:#7c3aed;--space:20px}*{box-sizing:border-box}body{font-family:Arial,sans-serif;font-size:16px;margin:0;color:#111827;min-height:3200px}header{position:sticky;top:0;z-index:5;background:white;border-bottom:1px solid #ddd;padding:12px 20px}main{display:grid;grid-template-columns:220px 1fr;gap:20px;padding:20px}.card{border:1px solid #ddd;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}button{background:var(--brand);color:white;border:0;border-radius:8px;padding:10px 16px;transition:transform 150ms ease}.media{position:relative;width:320px;height:180px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#111827,#7c3aed)}.media img{width:100%;height:100%;object-fit:cover}.chip{position:absolute;right:12px;bottom:12px;background:white;padding:4px 8px}.pulse{width:40px;height:40px;background:#f97316;animation:pulse 1s ease-in-out infinite alternate}@keyframes pulse{to{transform:translateX(24px);opacity:.45}}@media(max-width:760px){main{grid-template-columns:1fr}}
