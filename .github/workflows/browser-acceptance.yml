name: Browser acceptance

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:all
      - name: CLI extraction smoke
        run: |
          python3 -m http.server 4173 --directory tests/fixtures >/tmp/design-ref-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          sleep 1
          npm run extract:url -- --url http://127.0.0.1:4173/reference.html --out /tmp/design-reference --preset android-pixel6
          test -s /tmp/design-reference/DESIGN.raw.json
          test -s /tmp/design-reference/DESIGN.md
          test -s /tmp/design-reference/SKILL.md
          test -s /tmp/design-reference/source.png
          test -s /tmp/design-reference/source-full.png
          test -s /tmp/design-reference/run.json
          node -e 'const fs=require("fs"),c=require("crypto"); const r=JSON.parse(fs.readFileSync("/tmp/design-reference/run.json","utf8")); const h=p=>c.createHash("sha256").update(fs.readFileSync(p)).digest("hex"); if(!r.ok || r.schema!=="design-reference-run-v1" || r.preset!=="android-pixel6" || r.viewport?.width!==412 || r.viewport?.height!==915 || r.screenshot!=="source.png" || r.screenshot_mode!=="viewport" || !r.files["DESIGN.raw.json"]?.sha256 || r.files["source.png"]?.sha256!==h("/tmp/design-reference/source.png") || r.files["source-full.png"]?.sha256!==h("/tmp/design-reference/source-full.png")) process.exit(1)'
